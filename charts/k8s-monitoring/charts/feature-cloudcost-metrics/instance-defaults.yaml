# yamllint disable rule:line-length
---
# -- Name for this Cloud Cost Exporter instance. Used as the `instance` label on the scraped metrics and to name the
# generated Alloy components, so it must be unique within the feature.
# @section -- General Settings
name: ""

# -- The value of the job label for metrics scraped from this instance.
# @section -- General Settings
jobLabel: integrations/cloudcost-exporter

# -- Explicit scrape target address (`host:port`) for a Cloud Cost Exporter that this chart does not deploy, such as
# one managed outside the chart. When set, it takes precedence over `service`. Leave empty to target a Cloud Cost
# Exporter deployed by `telemetryServices.cloudcost-exporter`.
# @section -- Target
address: ""

# Settings used to build the scrape target when `address` is not set. These point at the in-cluster Cloud Cost
# Exporter Service, which by default is the one deployed by `telemetryServices.cloudcost-exporter`.
service:
  # -- Name of the Cloud Cost Exporter Service to scrape.
  # @default -- `<release>-cloudcost-exporter`
  # @section -- Target
  name: ""

  # -- Namespace of the Cloud Cost Exporter Service. Defaults to the release namespace.
  # @default -- Release namespace
  # @section -- Target
  namespace: ""

  # -- Port of the Cloud Cost Exporter Service.
  # @section -- Target
  port: 8080

  # -- The HTTP path to scrape metrics from.
  # @section -- Target
  metricsPath: /metrics

# -- Extra labels to add to all metrics scraped from this instance. Format: `<label>: <value>`.
# @section -- General Settings
labels: {}

# Settings for scraping and processing the metrics produced by this instance.
metrics:
  # -- How frequently to scrape metrics from the Cloud Cost Exporter.
  # Overrides `global.scrapeInterval`.
  # @default -- `60s`
  # @section -- Scrape Settings
  scrapeInterval: ""

  # -- The timeout for scraping metrics from the Cloud Cost Exporter.
  # Overrides `global.scrapeTimeout`.
  # @default -- `10s`
  # @section -- Scrape Settings
  scrapeTimeout: ""

  # -- (int) Sets the max_cache_size for the prometheus.relabel component for this instance.
  # This should be at least 2x-5x your largest scrape target or samples appended rate.
  # ([docs](https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.relabel/#arguments)).
  # Overrides `global.maxCacheSize`.
  # @default -- `100000`
  # @section -- Metric Processing Settings
  maxCacheSize:

  # Adjustments to the scraped metrics to filter the amount of data sent to storage.
  tuning:
    # -- Metrics to keep. Can use regular expressions.
    # @section -- Metric Processing Settings
    includeMetrics: []

    # -- Metrics to drop. Can use regular expressions.
    # @section -- Metric Processing Settings
    excludeMetrics: []

  # -- Rule blocks to be added to the prometheus.relabel component for this instance.
  # ([docs](https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.relabel/#rule-block))
  # These relabeling rules are applied post-scrape against the metrics returned from the scraped target.
  # @section -- Metric Processing Settings
  extraMetricProcessingRules: ""
